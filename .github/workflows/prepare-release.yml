name: Prepare & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.4.2 or v1.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Normalize version
        id: v
        run: |
          RAW="${{ github.event.inputs.version }}"
          # strip leading v if present
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          if yarn --version | grep -qE '^[0-9]+\.' && yarn --version | grep -q '^1\.'; then
            yarn install --frozen-lockfile
          else
            yarn install --immutable
          fi

      - name: Build assets
        run: yarn build

      - name: Commit built assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # resources/dist is gitignored; force-add it for the release commit
          git add -f resources/dist
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "chore: build assets for ${{ steps.v.outputs.version }}"

      - name: Push commit
        run: |
          # push back to the same branch the workflow runs on
          TARGET="${GITHUB_REF_NAME}"
          git fetch origin "$TARGET"
          git rebase "origin/$TARGET"
          git push origin HEAD:"$TARGET"

      - name: Create tag
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          # ensure tag doesn’t already exist
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"; exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Cleanup built assets from release branch
        run: |
          # remove built assets from the release branch after tagging; the tag still points to the commit with dist
          rm -rf resources/dist
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "chore: cleanup built assets after release ${{ steps.v.outputs.version }}"
          TARGET="${GITHUB_REF_NAME}"
          git push origin HEAD:"$TARGET"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Release ${{ steps.v.outputs.tag }}
          generate_release_notes: true
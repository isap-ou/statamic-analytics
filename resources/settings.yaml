      display: 'isapp-analytics::cp.Visitors and page views by date'
  - handle: total_visitors_and_pageviews
    field:
      default: false
      type: toggle
      display: 'isapp-analytics::cp.Total visitors and pageviews'
      width: 33
  - handle: most_visited_pages
    field:
      default: false
      type: toggle
      display: 'isapp-analytics::cp.Most visited pages'
      width: 33
  - handle: top_referrers
    field:
      default: false
      type: toggle
      display: 'isapp-analytics::cp.Top referrers'
      width: 33
  - handle: user_types
    field:
      default: false
      type: toggle
      display: 'isapp-analytics::cp.User Types'
      width: 33
  - handle: top_browsers
    field:
      default: false
      type: toggle
      display: 'isapp-analytics::cp.Top browsers'
      width: 33
  - handle: top_countries
    field:
      default: false
      type: toggle
      display: 'isapp-analytics::cp.Top countries'

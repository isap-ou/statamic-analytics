fields:
  - handle: property_id
    field:
      type: text
      display: 'Property ID'
      validate:
        - required
  - handle: handle
    field:
      type: hidden
      default: 'default'
#  - handle: service_account_credentials
#    field:
#      type: files
#      display: 'Client secret json file'
  - handle: widgets
    field:
      type: section
      display: 'isapp-analytics::cp.WidgetsHeadline'
  - handle: visitors_and_page_views
    field:
      default: false
      type: toggle
      display: 'isapp-analytics::cp.Visitors and page views'
      width: 33
  - handle: visitors_and_page_views_by_date
    field:
      default: false
      type: toggle
